<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguros Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--accent); color: white; }
        #loader { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align:center;"><h1>📊 Mi Cartera de Seguros</h1></div>
    <div id="loader">🚀 Cargando datos...</div>
    <div id="content" style="display:none;">
        <div class="grid">
            <div class="card"><h3>Ventas por Mes</h3><canvas id="chartVentas"></canvas></div>
            <div class="card"><h3>Ramos</h3><canvas id="chartRamos"></canvas></div>
        </div>
        <div class="card">
            <h3>Lista de Pólizas</h3>
            <div style="overflow-x:auto;">
                <table id="tabla">
                    <thead><tr><th>Mes</th><th>Asegurado</th><th>Póliza</th><th>Vigencia</th><th>Estatus</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // PEGA AQUÍ TU URL QUE YA FUNCIONA
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCK8UHaA46BF6pDW3Xvp3HlNE_xcJViYrK-KNPqUZqaujyfvXd0ldbjA4Brr35mt4/exec';

    async function cargar() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const ventasMes = {};
            const ramos = {};
            const tbody = document.querySelector('#tabla tbody');

            data.forEach(item => {
                // Usamos llaves en mayúsculas porque así vienen en tu imagen
                const mes = item.MES || 'S/D';
                const ramo = item.AUTO || 'OTROS';
                const prima = parseFloat(String(item['PRIMA TOTAL'] || "0").replace(/[$,]/g, "")) || 0;

                ventasMes[mes] = (ventasMes[mes] || 0) + prima;
                ramos[ramo] = (ramos[ramo] || 0) + 1;

                if(item.ASEGURADO) {
                    tbody.innerHTML += `<tr>
                        <td>${mes}</td>
                        <td>${item.ASEGURADO}</td>
                        <td>${item.POLIZA}</td>
                        <td>${String(item.VIGENCIA).split('T')[0]}</td>
                        <td>${item.ALERTA_SISTEMA || 'VIGENTE'}</td>
                    </tr>`;
                }
            });

            new Chart(document.getElementById('chartVentas'), {
                type: 'bar',
                data: { labels: Object.keys(ventasMes), datasets: [{ label: 'Prima $', data: Object.values(ventasMes), backgroundColor: '#3498db' }] }
            });

            new Chart(document.getElementById('chartRamos'), {
                type: 'pie',
                data: { labels: Object.keys(ramos), datasets: [{ data: Object.values(ramos), backgroundColor: ['#e74c3c','#2ecc71','#f1c40f','#9b59b6'] }] }
            });

        } catch (e) {
            document.getElementById('loader').innerHTML = "❌ Error: " + e;
        }
    }
    cargar();
</script>
</body>
</html>
