<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguros - Dashboard Final</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #2ecc71; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        h1, h3 { margin: 0 0 15px 0; color: var(--primary); }
        
        /* Acordeón de Meses */
        .mes-seccion { margin-bottom: 10px; border: 1px solid #e1e8ed; border-radius: 8px; overflow: hidden; background: white; }
        .mes-header { 
            padding: 15px; cursor: pointer; display: flex; 
            justify-content: space-between; align-items: center; font-weight: bold;
            transition: background 0.2s;
        }
        .mes-header:hover { background: #f8fafc; }
        .mes-header::after { content: '▼'; font-size: 12px; color: var(--accent); transition: 0.3s; }
        .mes-header.active::after { transform: rotate(180deg); }
        
        .mes-contenido { display: none; padding: 0 15px 15px 15px; overflow-x: auto; }
        .mes-contenido.show { display: block; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }
        th { color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .vigente { background: #e8f8f0; color: #2ecc71; }
        .alerta { background: #fdedec; color: #e74c3c; }
        
        #loader { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--accent); }
        .chart-container { height: 250px; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="text-align:center; border-top: 5px solid var(--accent);">
        <h1>📊 Control de Cartera y Comisiones</h1>
        <p style="color: #7f8c8d; margin: 0;">Sincronizado con Google Sheets</p>
    </div>

    <div id="loader">🚀 Cargando información...</div>

    <div id="content" style="display:none;">
        <div class="grid">
            <div class="card">
                <h3>💰 Primas Totales</h3>
                <div class="chart-container"><canvas id="chartPrimas"></canvas></div>
            </div>
            <div class="card">
                <h3>💵 Comisiones</h3>
                <div class="chart-container"><canvas id="chartComisiones"></canvas></div>
            </div>
            <div class="card">
                <h3>📋 Ramos</h3>
                <div class="chart-container"><canvas id="chartRamos"></canvas></div>
            </div>
        </div>

        <div class="card">
            <h3>🗂️ Detalle Mensual de Pólizas</h3>
            <div id="contenedor-desplegables"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCK8UHaA46BF6pDW3Xvp3HlNE_xcJViYrK-KNPqUZqaujyfvXd0ldbjA4Brr35mt4/exec';

    async function cargar() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const primasMes = {};
            const comisionesMes = {};
            const ramosContador = {};
            const agrupadoPorMes = {};
            const mesesOrden = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

            data.forEach(item => {
                // Función buscadora flexible para nombres de columnas
                const getVal = (nombreBase) => {
                    const keys = Object.keys(item);
                    // Busca una llave que contenga el nombre base, ignorando mayúsculas y espacios
                    const foundKey = keys.find(k => k.trim().toUpperCase().includes(nombreBase.toUpperCase()));
                    return foundKey ? item[foundKey] : "";
                };

                const asegurado = getVal("ASEGURADO");
                
                if (asegurado && asegurado.toString().trim() !== "") {
                    const mes = getVal("MES").toString().trim().toUpperCase() || "S/D";
                    const ramo = getVal("AUTO").toString().trim().toUpperCase() || "OTROS";
                    
                    // Limpieza estricta para PRIMA TOTAL:
                    const pRaw = getVal("PRIMA TOTAL").toString().replace(/[^0-9.]/g, "");
                    const prima = parseFloat(pRaw) || 0;

                    // Limpieza estricta para COMISIONES
                    const cRaw = getVal("COMISIONES").toString().replace(/[^0-9.]/g, "");
                    const comision = parseFloat(cRaw) || 0;

                    if (mesesOrden.includes(mes)) {
                        primasMes[mes] = (primasMes[mes] || 0) + prima;
                        comisionesMes[mes] = (comisionesMes[mes] || 0) + comision;
                        ramosContador[ramo] = (ramosContador[ramo] || 0) + 1;

                        if (!agrupadoPorMes[mes]) agrupadoPorMes[mes] = [];
                        agrupadoPorMes[mes].push({
                            asegurado,
                            poliza: getVal("POLIZA"),
                            prima,
                            comision,
                            ramo,
                            vigencia: String(getVal("VIGENCIA")).split('T')[0],
                            estatus: getVal("ALERTA_SISTEMA") || "VIGENTE"
                        });
                    }
                }
            });

            const contenedor = document.getElementById('contenedor-desplegables');
            mesesOrden.forEach(mes => {
                if (agrupadoPorMes[mes]) {
                    const html = `
                        <div class="mes-seccion">
                            <div class="mes-header" onclick="toggleMes(this)">
                                <span>${mes}</span>
                                <span style="color:var(--accent); font-size: 0.9em;">Prima: $${primasMes[mes].toLocaleString()} | Com: $${comisionesMes[mes].toLocaleString()}</span>
                            </div>
                            <div class="mes-contenido">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Asegurado</th>
                                            <th>Ramo</th>
                                            <th>Póliza</th>
                                            <th>Vigencia</th>
                                            <th>Prima</th>
                                            <th>Comisión</th>
                                            <th>Estatus</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${agrupadoPorMes[mes].map(p => `
                                            <tr>
                                                <td><strong>${p.asegurado}</strong></td>
                                                <td>${p.ramo}</td>
                                                <td>${p.poliza}</td>
                                                <td>${p.vigencia}</td>
                                                <td>$${p.prima.toLocaleString()}</td>
                                                <td style="color:var(--success); font-weight:bold;">$${p.comision.toLocaleString()}</td>
                                                <td><span class="badge ${p.estatus === 'VIGENTE' ? 'vigente' : 'alerta'}">${p.estatus}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>`;
                    contenedor.innerHTML += html;
                }
            });

            const etiquetas = mesesOrden.filter(m => primasMes[m]);
            
            new Chart(document.getElementById('chartPrimas'), {
                type: 'bar',
                data: { labels: etiquetas, datasets: [{ label: 'Prima Total $', data: etiquetas.map(m => primasMes[m]), backgroundColor: '#3498db', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            new Chart(document.getElementById('chartComisiones'), {
                type: 'bar',
                data: { labels: etiquetas, datasets: [{ label: 'Comisión $', data: etiquetas.map(m => comisionesMes[m]), backgroundColor: '#2ecc71', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            new Chart(document.getElementById('chartRamos'), {
                type: 'doughnut',
                data: { labels: Object.keys(ramosContador), datasets: [{ data: Object.values(ramosContador), backgroundColor: ['#e74c3c','#2ecc71','#f1c40f','#9b59b6','#34495e'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });

        } catch (e) {
            document.getElementById('loader').innerHTML = "❌ Error: " + e;
        }
    }

    function toggleMes(elemento) {
        elemento.classList.toggle('active');
        const contenido = elemento.nextElementSibling;
        contenido.classList.toggle('show');
    }

    cargar();
</script>
</body>
</html>
