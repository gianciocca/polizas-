<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguros Pro - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; }
        h1, h3 { margin-top: 0; color: var(--primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
        tr:hover { background-color: #f1f5f9; }
        .estatus-vigente { color: #2ecc71; font-weight: bold; background: #e8f8f0; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .estatus-alerta { color: #e74c3c; font-weight: bold; background: #fdedec; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        #loader { text-align: center; padding: 100px; font-size: 1.5rem; color: var(--accent); font-weight: 300; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="text-align:center;">
        <h1>📊 Panel de Control de Cartera</h1>
        <p style="color: #666;">Gestión de Pólizas, Ventas y Ramos en Tiempo Real</p>
    </div>

    <div id="loader">✨ Sincronizando con Google Sheets...</div>

    <div id="content" style="display:none;">
        <div class="grid">
            <div class="card">
                <h3>💰 Ventas Mensuales (Prima Total)</h3>
                <div class="chart-container">
                    <canvas id="chartVentas"></canvas>
                </div>
            </div>
            <div class="card">
                <h3>📋 Distribución por Ramo</h3>
                <div class="chart-container">
                    <canvas id="chartRamos"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🗂️ Listado General de Asegurados</h3>
            <div style="overflow-x:auto; max-height: 600px;">
                <table id="tabla">
                    <thead>
                        <tr>
                            <th>Mes</th>
                            <th>Asegurado</th>
                            <th>Ramo</th>
                            <th>Póliza</th>
                            <th>Vigencia</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // URL DE TU GOOGLE SCRIPT (Asegúrate que termine en /exec)
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCK8UHaA46BF6pDW3Xvp3HlNE_xcJViYrK-KNPqUZqaujyfvXd0ldbjA4Brr35mt4/exec';

    async function cargarDatos() {
        try {
            const respuesta = await fetch(API_URL);
            const datos = await respuesta.json();
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const ventasPorMes = {};
            const ramosContador = {};
            const tbody = document.querySelector('#tabla tbody');
            const mesesOrden = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

            datos.forEach(item => {
                // Buscador de columnas sin importar mayúsculas
                const getVal = (nombresPosibles) => {
                    const llaveEncontrada = Object.keys(item).find(k => nombresPosibles.includes(k.trim().toUpperCase()));
                    return llaveEncontrada ? item[llaveEncontrada] : "";
                };

                const asegurado = getVal(["ASEGURADO", "CLIENTE", "NOMBRE"]);
                
                // Solo procesamos filas que tengan un nombre de asegurado
                if (asegurado && asegurado.toString().trim() !== "") {
                    const mes = getVal(["MES"]).toString().trim().toUpperCase() || "S/D";
                    let ramo = getVal(["AUTO", "RAMO", "TIPO"]).toString().trim().toUpperCase() || "OTROS";
                    
                    // Unificar nombres similares (Auto y Autos)
                    if (ramo === "AUTOS") ramo = "AUTO";

                    // --- LIMPIEZA DE DINERO (CRÍTICO PARA LAS BARRAS) ---
                    let valorSocio = getVal(["PRIMA TOTAL", "PRIMA", "MONTO"]).toString();
                    let limpio = valorSocio.replace(/[^0-9.]/g, ""); // Quita $, comas y letras
                    
                    // Manejo de puntos decimales extraños
                    let partes = limpio.split('.');
                    if (partes.length > 2) limpio = partes.slice(0, -1).join('') + '.' + partes.slice(-1);
                    
                    const primaNum = parseFloat(limpio) || 0;
                    // ----------------------------------------------------

                    // Acumular para gráficas
                    ventasPorMes[mes] = (ventasPorMes[mes] || 0) + primaNum;
                    ramosContador[ramo] = (ramosContador[ramo] || 0) + 1;

                    // Insertar en Tabla
                    const vigencia = String(getVal(["VIGENCIA", "VENCE"])).split('T')[0];
                    const estatus = (getVal(["ALERTA_SISTEMA", "ESTATUS"]) || "VIGENTE").toUpperCase();
                    const claseEstatus = estatus === "VIGENTE" ? "estatus-vigente" : "estatus-alerta";

                    tbody.innerHTML += `
                        <tr>
                            <td>${mes}</td>
                            <td><strong>${asegurado}</strong></td>
                            <td>${ramo}</td>
                            <td>${getVal(["POLIZA", "NO. POLIZA"])}</td>
                            <td>${vigencia}</td>
                            <td><span class="${claseEstatus}">${estatus}</span></td>
                        </tr>
                    `;
                }
            });

            // --- CONFIGURACIÓN GRÁFICA DE VENTAS (BARRAS) ---
            const etiquetasMeses = mesesOrden.filter(m => ventasPorMes[m] !== undefined);
            const datosVentas = etiquetasMeses.map(m => ventasPorMes[m]);

            new Chart(document.getElementById('chartVentas'), {
                type: 'bar',
                data: {
                    labels: etiquetasMeses,
                    datasets: [{
                        label: 'Ventas en Prima $',
                        data: datosVentas,
                        backgroundColor: '#3498db',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, grid: { display: false } } }
                }
            });

            // --- CONFIGURACIÓN GRÁFICA DE RAMOS (DONA) ---
            new Chart(document.getElementById('chartRamos'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(ramosContador),
                    datasets: [{
                        data: Object.values(ramosContador),
                        backgroundColor: ['#e74c3c','#2ecc71','#f1c40f','#9b59b6','#34495e','#1abc9c','#f39c12']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

        } catch (error) {
            document.getElementById('loader').innerHTML = "❌ Error crítico: " + error;
            console.error(error);
        }
    }

    cargarDatos();
</script>

</body>
</html>
