<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguros Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--accent); color: white; position: sticky; top: 0; }
        #loader { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align:center;"><h1>📊 Mi Cartera de Seguros - Dashboard</h1></div>
    <div id="loader">🚀 Sincronizando datos...</div>
    <div id="content" style="display:none;">
        <div class="grid">
            <div class="card"><h3>💰 Ventas por Mes (Prima Total)</h3><canvas id="chartVentas"></canvas></div>
            <div class="card"><h3>📋 Distribución por Ramo</h3><canvas id="chartRamos"></canvas></div>
        </div>
        <div class="card">
            <h3>🗂️ Registro de Pólizas</h3>
            <div style="overflow-x:auto; max-height: 500px;">
                <table id="tabla">
                    <thead><tr><th>Mes</th><th>Asegurado</th><th>Ramo</th><th>Póliza</th><th>Vigencia</th><th>Estatus</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // URL DE TU SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCK8UHaA46BF6pDW3Xvp3HlNE_xcJViYrK-KNPqUZqaujyfvXd0ldbjA4Brr35mt4/exec';

    async function cargar() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const ventasMes = {};
            const ramos = {};
            const tbody = document.querySelector('#tabla tbody');
            const ordenMeses = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

            data.forEach(item => {
                // Función buscadora de columnas inteligente
                const getVal = (nombres) => {
                    const key = Object.keys(item).find(k => nombres.includes(k.trim().toUpperCase()));
                    return key ? item[key] : "";
                };

                const asegurado = getVal(["ASEGURADO", "CLIENTE", "NOMBRE"]);
                
                if (asegurado && asegurado.toString().trim() !== "") {
                    const mes = getVal(["MES"]).toString().trim().toUpperCase() || "S/D";
                    let ramo = getVal(["AUTO", "RAMO", "TIPO"]).toString().trim().toUpperCase() || "OTROS";
                    if (ramo === "AUTOS") ramo = "AUTO"; // Unificar

                    // Limpieza agresiva de dinero: quita todo lo que no sea número o punto
                    const primaRaw = getVal(["PRIMA TOTAL", "PRIMA", "MONTO"]).toString().replace(/[^0-9.]/g, "");
                    const prima = parseFloat(primaRaw) || 0;

                    // Acumular datos para gráficas
                    ventasMes[mes] = (ventasMes[mes] || 0) + prima;
                    ramos[ramo] = (ramos[ramo] || 0) + 1;

                    // Llenar la tabla
                    tbody.innerHTML += `<tr>
                        <td>${mes}</td>
                        <td><strong>${asegurado}</strong></td>
                        <td>${ramo}</td>
                        <td>${getVal(["POLIZA"])}</td>
                        <td>${String(getVal(["VIGENCIA"])).split('T')[0]}</td>
                        <td><span style="color:${getVal(["ALERTA_SISTEMA"]) !== 'VIGENTE' ? 'red' : 'green'}">${getVal(["ALERTA_SISTEMA"]) || 'VIGENTE'}</span></td>
                    </tr>`;
                }
            });

            // Configurar Gráfica de Barras
            const etiquetasMeses = ordenMeses.filter(m => ventasMes[m] !== undefined);
            const valoresVentas = etiquetasMeses.map(m => ventasMes[m]);

            new Chart(document.getElementById('chartVentas'), {
                type: 'bar',
                data: {
                    labels: etiquetasMeses,
                    datasets: [{
                        label: 'Prima Total $',
                        data: valoresVentas,
                        backgroundColor: '#3498db',
                        borderWidth: 1
                    }]
                },
                options: { scales: { y: { beginAtZero: true } } }
            });

            // Configurar Gráfica de Pastel
            new Chart(document.getElementById('chartRamos'), {
                type: 'pie',
                data: {
                    labels: Object.keys(ramos),
                    datasets: [{
                        data: Object.values(ramos),
                        backgroundColor: ['#e74c3c','#2ecc71','#f1c40f','#9b59b6','#34495e','#1abc9c','#f39c12']
                    }]
                }
            });

        } catch (e) {
            document.getElementById('loader').innerHTML = "❌ Error al cargar datos: " + e;
        }
    }
    cargar();
</script>
</body>
</html>
