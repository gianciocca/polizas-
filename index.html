<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguros Pro - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #2ecc71; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: auto; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e1e8ed; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        h1, h3 { margin-top: 0; color: var(--primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 11px; }
        tr:hover { background-color: #f1f5f9; }
        #loader { text-align: center; padding: 100px; font-size: 1.5rem; color: var(--accent); }
        .chart-container { position: relative; height: 280px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="text-align:center;">
        <h1>📊 Dashboard de Cartera y Comisiones</h1>
    </div>

    <div id="loader">✨ Cargando datos desde Excel...</div>

    <div id="content" style="display:none;">
        <div class="grid">
            <div class="card">
                <h3>💰 Primas Totales</h3>
                <div class="chart-container"><canvas id="chartPrimas"></canvas></div>
            </div>
            <div class="card">
                <h3>💵 Comisiones</h3>
                <div class="chart-container"><canvas id="chartComisiones"></canvas></div>
            </div>
            <div class="card">
                <h3>📋 Ramos</h3>
                <div class="chart-container"><canvas id="chartRamos"></canvas></div>
            </div>
        </div>

        <div class="card">
            <h3>🗂️ Detalle de Pólizas</h3>
            <div style="overflow-x:auto; max-height: 500px;">
                <table id="tabla">
                    <thead>
                        <tr>
                            <th>Mes</th>
                            <th>Asegurado</th>
                            <th>Póliza</th>
                            <th>Prima Total</th>
                            <th>Comisión</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCK8UHaA46BF6pDW3Xvp3HlNE_xcJViYrK-KNPqUZqaujyfvXd0ldbjA4Brr35mt4/exec';

    async function cargarDatos() {
        try {
            const respuesta = await fetch(API_URL);
            const datos = await respuesta.json();
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const primasMes = {};
            const comisionesMes = {};
            const ramosContador = {};
            const tbody = document.querySelector('#tabla tbody');
            const mesesOrden = ["ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO", "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"];

            datos.forEach(item => {
                // Función de búsqueda exacta para evitar que "Prima Neta" se meta en "Prima Total"
                const getValExacto = (nombreExacto) => {
                    const keys = Object.keys(item);
                    // Buscamos la llave que coincida exactamente ignorando espacios
                    const foundKey = keys.find(k => k.trim().toUpperCase() === nombreExacto.toUpperCase());
                    return foundKey ? item[foundKey] : "";
                };

                const asegurado = getValExacto("ASEGURADO") || getValExacto("CLIENTE");
                
                if (asegurado && asegurado.toString().trim() !== "") {
                    const mes = getValExacto("MES").toString().trim().toUpperCase() || "S/D";
                    const ramo = getValExacto("AUTO").toString().trim().toUpperCase() || "OTROS";

                    // --- LIMPIEZA DE PRIMA TOTAL: (Buscamos el nombre exacto con los dos puntos) ---
                    let primaRaw = getValExacto("PRIMA TOTAL:").toString().replace(/[^0-9.]/g, "");
                    const primaNum = parseFloat(primaRaw) || 0;

                    // --- LIMPIEZA DE COMISIONES: ---
                    let comisionRaw = getValExacto("COMISIONES").toString().replace(/[^0-9.]/g, "");
                    const comisionNum = parseFloat(comisionRaw) || 0;

                    // Acumular solo si el mes existe en nuestra lista
                    if (mesesOrden.includes(mes)) {
                        primasMes[mes] = (primasMes[mes] || 0) + primaNum;
                        comisionesMes[mes] = (comisionesMes[mes] || 0) + comisionNum;
                        ramosContador[ramo] = (ramosContador[ramo] || 0) + 1;
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td>${mes}</td>
                            <td><strong>${asegurado}</strong></td>
                            <td>${getValExacto("POLIZA")}</td>
                            <td>$${primaNum.toLocaleString()}</td>
                            <td style="color:green;">$${comisionNum.toLocaleString()}</td>
                            <td>${getValExacto("ALERTA_SISTEMA") || 'VIGENTE'}</td>
                        </tr>`;
                }
            });

            const etiquetas = mesesOrden.filter(m => primasMes[m] !== undefined);

            // Gráfica de Primas
            new Chart(document.getElementById('chartPrimas'), {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{ label: 'Prima Total $', data: etiquetas.map(m => primasMes[m]), backgroundColor: '#3498db' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Gráfica de Comisiones
            new Chart(document.getElementById('chartComisiones'), {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{ label: 'Comisión $', data: etiquetas.map(m => comisionesMes[m]), backgroundColor: '#2ecc71' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Gráfica de Ramos
            new Chart(document.getElementById('chartRamos'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(ramosContador),
                    datasets: [{ data: Object.values(ramosContador), backgroundColor: ['#e74c3c','#2ecc71','#f1c40f','#9b59b6','#34495e'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

        } catch (error) {
            document.getElementById('loader').innerHTML = "❌ Error: " + error;
        }
    }
    cargarDatos();
</script>
</body>
</html>
